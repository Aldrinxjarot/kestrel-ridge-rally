<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kestrel Ridge Rally — a flight game</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0c1218;
    height: 100%;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    width: min(100vw, 150vh);
    height: auto;
    aspect-ratio: 3 / 2;
    display: block;
    background: #87a9c4;
    box-shadow: 0 0 60px rgba(0, 0, 0, 0.55);
    cursor: crosshair;
  }
</style>
</head>
<body>
<canvas id="sky" width="1200" height="800"></canvas>
<script type="module" src="main.js"></script>
</body>
</html>
